<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #050506; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .og img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }
  .og::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(5,5,6,.92) 0%, rgba(5,5,6,.6) 55%, rgba(5,5,6,.25) 100%), linear-gradient(0deg, rgba(5,5,6,.9), transparent 45%); }
  .og::after { content: ""; position: absolute; inset: 0; z-index: 1; opacity: .35; background: repeating-linear-gradient(0deg, rgba(0,0,0,.5) 0 1px, transparent 1px 3px); }
  .in { position: absolute; inset: 56px 64px; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; }
  .og .hero__title { font-size: 104px; margin: 0; visibility: visible !important; }
  .og .hero__title .line { overflow: visible; }
  .meta { display: flex; gap: 22px; align-items: center; font-family: var(--font-mono); font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: rgba(242,242,242,.75); }
  .meta i { color: var(--accent); font-style: normal; }
  .logo__mark { font-size: 40px; }
  .logo__by { font-size: 13px; }
</style>
</head>
<body>
  <div class="og">
    <img src="../assets/img/location.webp" alt="">
    <div class="in">
      <span class="logo"><span class="logo__mark">s<b>LED</b></span><span class="logo__by">by Ascensio Holding</span></span>
      <h1 class="hero__title"><span class="line">Nechajte vašu</span><span class="line">reklamu <em>vyniknúť</em></span></h1>
      <div class="meta"><span>Popradská · Stará Ľubovňa</span><i>✦</i><span>16,58 m²</span><i>✦</i><span>Full HD</span><i>✦</i><span>až 20 000 áut denne</span></div>
    </div>
  </div>
</body>
</html>
